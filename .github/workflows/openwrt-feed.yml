name: openwrt-package-feed

on:
  schedule:
    - cron: '0 20 * * *' # 每天北京时间凌晨 4 点自动运行 (UTC 20:00)
  workflow_dispatch:      # 允许在 GitHub 网页手动点击按钮立即触发

jobs:
  merge-repos:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout My Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Git Configuration
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Clear and Recreate Target Directory
      run: |
        # 每次清空旧目录，防止上游已经删除的软件在你的仓库残留
        rm -rf feeds/
        mkdir -p feeds/

    - name: Copy and Merge Repositories
      run: |
        # 核心物理复制函数
        copy_feed() {
          local repo_url=$1
          local branch=${2:-""}
          local tmp_dir=$(mktemp -d)
          
          echo "正在下载仓库: $repo_url"
          if [ -n "$branch" ]; then
            git clone -b "$branch" --depth=1 "$repo_url" "$tmp_dir"
          else
            git clone --depth=1 "$repo_url" "$tmp_dir"
          fi
          
          # 扫描所有 Makefile 并提取软件包（支持嵌套多层的 Feed 仓库）
          find "$tmp_dir" -maxdepth 4 -name "Makefile" | while read -r makefile; do
            local pkg_dir=$(dirname "$makefile")
            local pkg_name=$(basename "$pkg_dir")
            
            if [ "$pkg_name" != "$(basename "$tmp_dir")" ]; then
              echo "  -> 正在复制软件包: $pkg_name"
              cp -r "$pkg_dir" "feeds/"
              # 强行删除可能存在的嵌套 .git 文件夹，防止识别为损坏的子模块
              rm -rf "feeds/$pkg_name/.git"
            fi
          done
          rm -rf "$tmp_dir"
        }

        # ==================== 【您指定的 6 个同步仓库列表】 ====================
        # 格式：copy_feed "GitHub仓库链接" "分支名(选填，留空则克隆默认分支)"
        
        # 1. Nikki 核心与插件（多包集成仓库，已支持深度扫描）
        copy_feed "https://github.com/nikkinikki-org/OpenWrt-nikki.git" "main"
        
        # 2. sirpdboy 的定时任务与家长控制
        copy_feed "https://github.com/sirpdboy/luci-app-taskplan" "main"
        copy_feed "https://github.com/sirpdboy/luci-app-parentcontrol.git" "main"
        
        # 3. AirConnect 无线音频桥接
        copy_feed "https://github.com/sbwml/luci-app-airconnect.git" "main"
        
        # 4. sirpdboy 的网络测速
        copy_feed "https://github.com/sirpdboy/luci-app-netspeedtest" "main"
        
        # 5. 网络唤醒加强版
        copy_feed "https://github.com/isalikai/luci-app-owq-wol.git" "master"
        
        # ====================================================================

    - name: Commit and Push Changes
      run: |
        git add feeds/
        if git diff --staged --quiet; then
          echo "没有任何代码变更，跳过提交。"
        else
          git commit -m "自动物理同步：$(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push origin main
        fi
