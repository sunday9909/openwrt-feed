name: Sync-openwrt-package

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  merge-repos:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout My Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Git Configuration
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"

    - name: Copy and Merge Repositories
      run: |
        copy_feed() {
          local repo_url=$1
          local repo_name=$(basename "$repo_url" .git)
          local tmp_dir=$(mktemp -d)
          
          echo "正在下载仓库: $repo_url"
          git clone --depth=1 "$repo_url" "$tmp_dir"
          
          # 修正：这里之前错写成了 end，现已改为正确的 fi
          if [ -d "$tmp_dir" ] && [ "$(ls -A $tmp_dir)" ]; then
            rm -rf "$repo_name"
          else
            echo "错误: 仓库 $repo_url 下载失败！"
            rm -rf "$tmp_dir"
            return 1
          fi
          
          if [ -f "$tmp_dir/Makefile" ]; then
            mkdir -p "$repo_name"
            cp -r "$tmp_dir"/. "$repo_name/"
          else
            find "$tmp_dir" -maxdepth 4 -name "Makefile" | while read -r makefile; do
              local pkg_dir=$(dirname "$makefile")
              local pkg_name=$(basename "$pkg_dir")
              if [ "$pkg_dir" != "$tmp_dir" ]; then
                if [ "$pkg_name" = "$repo_name" ]; then
                  mkdir -p "$repo_name"
                  cp -r "$pkg_dir"/. "$repo_name/"
                else
                  mkdir -p "$repo_name/$pkg_name"
                  cp -r "$pkg_dir"/. "$repo_name/$pkg_name/"
                fi
              fi
            done
          fi
          find "$repo_name" -name ".git" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$tmp_dir"
        }
        
        
        # 1. Nikki 核心与插件（多包集成仓库，已支持深度扫描）
        copy_feed "https://github.com/nikkinikki-org/OpenWrt-nikki.git"
        
        # 2. sirpdboy 的定时任务与家长控制
        copy_feed "https://github.com/sirpdboy/luci-app-taskplan.git"
        
        copy_feed "https://github.com/sirpdboy/luci-app-parentcontrol.git"
        
        # 3. AirConnect 无线音频桥接
        copy_feed "https://github.com/sbwml/luci-app-airconnect.git"
        
        # 4. sirpdboy 的网络测速
        copy_feed "https://github.com/sirpdboy/netspeedtest.git"
        
        # 5. 网络唤醒加强版
        copy_feed "https://github.com/isalikai/luci-app-owq-wol.git"


        copy_feed "https://github.com/qosmio/nss-packages.git"

    - name: Commit and Push Changes
      run: |
        git add .
        if git diff --staged --quiet; then
          echo "没有检测到任何文件变更，跳过提交。"
        else
          git commit -m "自动同步：更新外部 Feeds 软件包库 ($(date +'%Y-%m-%d %H:%M:%S'))"
          git push origin HEAD
        fi
